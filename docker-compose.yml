version: "3.9"

services:
  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
      - .env.local
    restart: unless-stopped

  # Python IoT Gateway (Adafruit IO → PostgreSQL)
  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    command: python adafruit_to_db.py
    env_file:
      - .env
      - .env.local
    restart: unless-stopped
    depends_on:
      - web

  # FastAPI Face AI Server
  faceai:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    command: uvicorn ml.face_fastapi_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local
    restart: unless-stopped
