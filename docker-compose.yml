services:
  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    restart: unless-stopped

  # Python IoT Gateway (Adafruit IO → PostgreSQL)
  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    command: python adafruit_to_db.py
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    restart: unless-stopped
    depends_on:
      - web

  # FastAPI Face AI Server
  faceai:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    # Download OpenCV/OpenFace models on first start (skipped if already present)
    command: sh -c "python ml/download_models.py && uvicorn ml.face_fastapi_server:app --host 0.0.0.0 --port 8000"
    volumes:
      - faceai-models:/app/ml/models
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    restart: unless-stopped

volumes:
  faceai-models:
